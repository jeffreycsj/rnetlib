name: release-archive

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful release-qualification run ID
        required: true
        type: string
      qualification_attempt:
        description: Exact successful attempt (must still be the latest attempt)
        required: true
        type: string
      commit:
        description: Full qualified commit SHA
        required: true
        type: string
      tag:
        description: Existing protected candidate tag pointing to that commit
        required: true
        type: string

permissions: {}

# Never cancel a draft upload halfway through to start another publication for its tag.
concurrency:
  group: rnet-release-archive-${{ inputs.tag }}
  cancel-in-progress: false

env:
  QUALIFICATION_RUN: ${{ inputs.qualification_run }}
  QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
  QUALIFIED_COMMIT: ${{ inputs.commit }}
  CANDIDATE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    # Disabled until administrators configure/rehearse the documented protection rules.
    if: vars.RNET_RELEASE_ARCHIVE_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Linux, X64, rnet-qualification]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      binding: ${{ steps.verify.outputs.binding }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify hosted origin and every archived gate without writing a Release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/github_archive.py verify \
            --run-id "$QUALIFICATION_RUN" --attempt "$QUALIFICATION_ATTEMPT" \
            --commit "$QUALIFIED_COMMIT" --tag "$CANDIDATE_TAG"

  publish:
    needs: verify
    if: vars.RNET_RELEASE_ARCHIVE_ENABLED == 'true' && needs.verify.result == 'success'
    runs-on: [self-hosted, Linux, X64, rnet-qualification]
    timeout-minutes: 30
    environment: rnet-release-archive
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reverify approved bytes and seal complete candidate attachments
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BINDING: ${{ needs.verify.outputs.binding }}
        run: |
          python3 -B scripts/github_archive.py publish \
            --run-id "$QUALIFICATION_RUN" --attempt "$QUALIFICATION_ATTEMPT" \
            --commit "$QUALIFIED_COMMIT" --tag "$CANDIDATE_TAG" \
            --expected-binding "$EXPECTED_BINDING"
