name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native documentation test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Test scripts on the selected interpreter
        run: |
          python3 --version
          clang --version
          python3 -B -m unittest discover -s scripts/tests -v

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.85.0
      - run: cargo check --workspace --all-targets --locked

  linux:
    needs: python-compat
    # Set only after provisioning a suitable runner; the memory gate still applies.
    runs-on: ${{ vars.RNET_LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "1"
      RNET_REQUIRE_RESOURCE_TESTS: "1"
      RNET_RESOURCE_PROFILE: "github-ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - name: Check ordinary CI memory budget before building
        run: |
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from release_evidence import memory_available
          available = memory_available()
          print(f"CI MemAvailable: {available / 1024**3:.2f} GiB", flush=True)
          if available < 6 * 1024**3:
              raise SystemExit(f"CI requires 6 GiB available memory (2 GiB probe reserve + 4 GiB build headroom); found {available / 1024**3:.2f} GiB. Set RNET_LINUX_RUNNER to a provisioned runner label with sufficient memory.")
          PY
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0, Node.js 24
        with:
          go-version: "1.22.x"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install native documentation checker dependencies
        run: sudo apt-get update && sudo apt-get install -y clang python3
      - name: Install checksum-pinned offline rule validator (not a monitoring server)
        run: |
          tool_dir="$(mktemp -d)"
          cd "${tool_dir}"
          curl --fail --location --retry 3 --output prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz
          echo '19700bdd42ec31ee162e4079ebda4cd0a44432df4daa637141bdbea4b1cd8927  prometheus.tar.gz' | sha256sum -c -
          tar -xzf prometheus.tar.gz prometheus-2.55.1.linux-amd64/promtool
          sudo install -m 0755 prometheus-2.55.1.linux-amd64/promtool /usr/local/bin/promtool
      - run: make ops-test
      - run: cargo fmt --check
      - run: make structure-check
      - run: make header-check
      - run: make doc-check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: make rust-consumer-check
      - run: make c-test
      - run: make cpp-test
      - run: make go-test
      - run: CGO_ENABLED=1 go test -a -p 1 -count=1 -race ./go/rnet ./examples/go/game_quickstart
      - run: CGO_ENABLED=1 go test -a -p 1 -count=1 -race -tags rnet_test_faults ./go/rnet
      - run: make csharp-test
      - run: make abi-check
      - run: make package
      # Extract the archive and final-link all language examples before upload.
      - run: make package-smoke
      - name: Archive development SDK package (not full release qualification)
        uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/linux-x86_64.tar.gz*
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Install the audit tools validated by the repository gate
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - run: make -j1 dependency-check

  concurrency-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - run: make loom-test

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-09-21
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: make fuzz-asan-smoke

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-09-21
          components: miri
      - run: make miri-test
