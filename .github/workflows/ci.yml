name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.85.0
      - run: cargo check --workspace --all-targets --locked

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install native documentation checker dependencies
        run: sudo apt-get update && sudo apt-get install -y clang python3
      - run: cargo fmt --check
      - run: make structure-check
      - run: make header-check
      - run: make doc-check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: make c-test
      - run: make cpp-test
      - run: make go-test
      - run: CGO_ENABLED=1 go test -a -p 1 -count=1 -race ./go/rnet ./examples/go/game_quickstart
      - run: CGO_ENABLED=1 go test -a -p 1 -count=1 -race -tags rnet_test_faults ./go/rnet
      - run: make csharp-test
      - run: make abi-check
      - run: make package
      - run: cd dist/linux-x86_64 && CGO_ENABLED=1 go run -buildvcs=false -a -p 1 ./examples/go/game_quickstart tcp --one-slot
      - run: LD_LIBRARY_PATH="$PWD/dist/linux-x86_64/lib" dotnet run --project dist/linux-x86_64/csharp/RNet.Smoke -c Release -p:RNetDll="$PWD/dist/linux-x86_64/lib/RNet.dll"
      - run: LD_LIBRARY_PATH="$PWD/dist/linux-x86_64/lib" dotnet run --project dist/linux-x86_64/csharp/RNet.Quickstart -c Release -p:RNetDll="$PWD/dist/linux-x86_64/lib/RNet.dll" -- tcp --one-slot
      - name: Archive development SDK package (not full release qualification)
        uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/linux-x86_64.tar.gz*
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  concurrency-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - run: make loom-test

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-09-21
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: make fuzz-asan-smoke

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-09-21
          components: miri
      - run: make miri-test
