name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace --all-targets --locked

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: make cpp-test
      - run: make go-test

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  concurrency-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make loom-test

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run -s address frame_parser -- -max_total_time=10 -max_len=1048576 -rss_limit_mb=2048
      - run: cargo fuzz run -s address control_parser -- -max_total_time=10 -max_len=131072 -rss_limit_mb=2048
      - run: cargo fuzz run -s address datagram_preflight -- -max_total_time=10 -max_len=2048 -rss_limit_mb=2048
      - run: cargo fuzz run -s address kcp_engine -- -max_total_time=10 -max_len=65535 -rss_limit_mb=2048
      - run: cargo fuzz run -s address game_wire -- -max_total_time=10 -max_len=65535 -rss_limit_mb=2048
      - run: cargo fuzz run -s address ffi_config -- -max_total_time=10 -max_len=64 -rss_limit_mb=2048

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p rnet-core -p rnet-protocol
